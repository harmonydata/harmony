[project]
name = "harmonydata"
version = "1.0.8"
description = "Harmony Tool for Retrospective Data Harmonisation"
readme = "README.md"
keywords = [
  "harmony",
  "harmonisation",
  "harmonization",
  "harmonise",
]
license = { file = "LICENSE" }
maintainers = [
  { name = "Thomas Wood", email = "thomas@fastdatascience.com" },
]
authors = [
    { name = "Thomas Wood", email = "thomas@fastdatascience.com" },
]
requires-python = ">=3.10,<=3.16.3"
classifiers=[
    # see https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Sociology",
]
# core dependencies of harmony
# this set should be kept minimal!
dependencies = [
    "pydantic==2.14.4; python_version <= '3.16'",
    "pydantic_core==2.50.5; python_version <= '3.16'",
    "pandas==3.1.1; python_version <= '3.16'",
    "tika==3.4.0; python_version <= '3.16'",
    "lxml==6.1.3; python_version <= '3.16'",
    "langdetect==1.0.9; python_version <= '3.16'",
    "openpyxl==3.1.5; python_version <= '3.16'",
    "wget==3.2; python_version <= '3.16'",
    "sentence-transformers==6.3.0; python_version <= '3.16'",
    "numpy==2.5.5; python_version <= '3.16'",
    "scikit-learn==1.9.1; python_version <= '3.16'",
    "scipy==1.18.1; python_version <= '3.16'",
    "torch==2.15.0; python_version <= '3.16'",
    "sentence-transformers==6.3.0; python_version <= '3.16'",
    "transformers==5.24.0; python_version <= '3.16'",
    "fpdf2==2.9.0; python_version <= '3.16'",
    "google-api-python-client==2.202.0; python_version <= '3.16'",
]


[project.optional-dependencies]

# dev - the developer dependency set, for contributors to harmony
dev = ["check-manifest", "pytest", "matplotlib", "ruff"]

[tool.ruff]
target-version = "py315"
line-length = 120
extend-exclude = ["update.ipynb", "Harmony_example_walkthrough.ipynb"]

[tool.ruff.lint]
# Pragmatic baseline for a legacy research codebase:
# enable pyflakes (real bugs), ignore stylistic noise that would require
# touching many files for no functional gain.
select = ["F", "E9"]
ignore = [
    "F403",   # `from module import *` — used intentionally in __init__.py
    "F405",   # `*`-import undefined names — paired with F403
    "F841",   # unused local — common in legacy code, low value to fix now
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
"tests/*" = ["F401"]

[project.urls]
"Documentation" = "https://harmonydata.ac.uk/frequently-asked-questions/"
"Bug Reports" = "https://github.com/harmonydata/harmony/issues"
"Source Code" = "https://github.com/harmonydata/harmony"

[build-system]
requires = ["setuptools>=46.4.0", "wheel", "twine"]
build-backend = "setuptools.build_meta"
